<!doctype html>
<html lang="en">
  <head>
    <!-- Apply stored theme before React boots to prevent FOUC -->
    <script>
      try {
        var t = localStorage.getItem('ipo-theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch(e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPO Terminal — Decision Engine</title>
    <meta name="description" content="IPO listing-gain decision engine. Rule-based strategy with 318 Mainboard IPOs 2018–2024." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
