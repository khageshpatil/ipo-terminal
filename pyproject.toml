[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipo-analyzer"
version = "0.1.0"
description = "IPO Listing-Gain Decision Engine — research foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "yfinance>=1.7.0",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pandas-stubs>=2.2",
]

[project.scripts]
ipo-research = "ipo_analyzer.research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ipo_analyzer"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/ipo_analyzer"]
omit = ["*/api/*", "*/web/*", "*/backtest/*", "*/models/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
